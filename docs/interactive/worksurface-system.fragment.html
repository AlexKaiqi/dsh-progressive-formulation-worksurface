<style>
  #ws-system-design {
    --ws-bg: var(--background, Canvas);
    --ws-fg: var(--foreground, CanvasText);
    --ws-muted: var(--muted, ButtonFace);
    --ws-muted-fg: var(--muted-foreground, GrayText);
    --ws-border: var(--border, color-mix(in srgb, CanvasText 18%, transparent));
    --ws-primary: var(--primary, AccentColor);
    --ws-accent: var(--accent, color-mix(in srgb, AccentColor 16%, transparent));
    --ws-blue: var(--blue, LinkText);
    --ws-purple: var(--purple, VisitedText);
    --ws-orange: var(--orange, MarkText);
    --ws-green: var(--green, AccentColor);
    --ws-line: color-mix(in srgb, var(--ws-fg) 24%, transparent);
    --ws-soft: color-mix(in srgb, var(--ws-muted) 72%, transparent);
    --ws-primary-soft: color-mix(in srgb, var(--ws-primary) 13%, transparent);
    --ws-blue-soft: color-mix(in srgb, var(--ws-blue) 13%, transparent);
    --ws-purple-soft: color-mix(in srgb, var(--ws-purple) 13%, transparent);
    --ws-orange-soft: color-mix(in srgb, var(--ws-orange) 14%, transparent);
    color-scheme: light dark;
    color: var(--ws-fg);
    font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
    font-size: var(--font-size-base, 14px);
    width: 100%;
  }

  #ws-system-design .ws-title-row {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: space-between;
    margin-block-end: 0.5rem;
  }

  #ws-system-design h2 {
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0;
  }

  #ws-system-design .ws-controls {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
  }

  #ws-system-design .ws-controls .btn[aria-pressed="true"] {
    background: var(--ws-accent);
    color: var(--ws-fg);
  }

  #ws-system-design .ws-stage {
    position: relative;
    width: 100%;
  }

  #ws-system-design svg {
    display: block;
    overflow: visible;
    width: 100%;
  }

  #ws-system-design .ws-edge {
    fill: none;
    stroke: var(--ws-line);
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.7;
  }

  #ws-system-design .ws-edge-primary { stroke: var(--ws-primary); }
  #ws-system-design .ws-edge-control { stroke: var(--ws-blue); }
  #ws-system-design .ws-edge-pending {
    stroke: var(--ws-purple);
    stroke-dasharray: 5 6;
  }

  #ws-system-design .ws-node {
    transition: opacity 160ms ease, filter 160ms ease;
  }

  #ws-system-design .ws-node.is-dimmed {
    filter: saturate(0.25);
    opacity: 0.18;
  }

  #ws-system-design .ws-shape {
    fill: var(--ws-bg);
    stroke: var(--ws-border);
    stroke-width: 1.3;
  }

  #ws-system-design .ws-surface-shell {
    fill: var(--ws-primary-soft);
    stroke: var(--ws-primary);
    stroke-width: 2.2;
  }

  #ws-system-design .ws-blue-shape {
    fill: var(--ws-blue-soft);
    stroke: var(--ws-blue);
  }

  #ws-system-design .ws-purple-shape {
    fill: var(--ws-purple-soft);
    stroke: var(--ws-purple);
    stroke-dasharray: 6 5;
  }

  #ws-system-design .ws-orange-shape {
    fill: var(--ws-orange-soft);
    stroke: var(--ws-orange);
  }

  #ws-system-design .ws-label {
    fill: var(--ws-fg);
    font-size: 13px;
    font-weight: 650;
  }

  #ws-system-design .ws-sub {
    fill: var(--ws-muted-fg);
    font-size: 11px;
  }

  #ws-system-design .ws-kicker {
    fill: var(--ws-muted-fg);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  #ws-system-design .ws-status-ok { fill: var(--ws-green); }
  #ws-system-design .ws-status-partial { fill: var(--ws-orange); }
  #ws-system-design .ws-status-pending { fill: var(--ws-purple); }

  #ws-system-design .ws-detail {
    align-items: baseline;
    border-block-start: 1px solid var(--ws-border);
    display: grid;
    gap: 0.25rem 0.75rem;
    grid-template-columns: max-content 1fr;
    margin-block-start: 0.25rem;
    padding-block-start: 0.65rem;
  }

  #ws-system-design .ws-detail strong {
    font-size: 0.82rem;
    font-weight: 650;
  }

  #ws-system-design .ws-detail span {
    color: var(--ws-muted-fg);
    font-size: 0.82rem;
  }

  @media (max-width: 520px) {
    #ws-system-design .ws-title-row { align-items: flex-start; }
    #ws-system-design .ws-controls { width: 100%; }
    #ws-system-design .ws-detail { grid-template-columns: 1fr; }
  }
</style>

<section id="ws-system-design" aria-labelledby="ws-system-title">
  <div class="ws-title-row">
    <h2 id="ws-system-title">WorkSurface 系统设计</h2>
    <div class="ws-controls" aria-label="设计视角">
      <button class="btn btn-ghost" type="button" data-lens="all" aria-pressed="true">整体</button>
      <button class="btn btn-ghost" type="button" data-lens="surface" aria-pressed="false">Surface</button>
      <button class="btn btn-ghost" type="button" data-lens="episode" aria-pressed="false">Episode</button>
      <button class="btn btn-ghost" type="button" data-lens="orchestrate" aria-pressed="false">Orchestrate</button>
    </div>
  </div>
  <div class="ws-stage">
    <svg role="img" aria-labelledby="ws-diagram-title ws-diagram-desc"></svg>
  </div>
  <div class="ws-detail" aria-live="polite">
    <strong data-detail-title>整体关系</strong>
    <span data-detail-copy>Surface 是持续维护的工作上下文；DSH Session 承载推进；事件把事实交给 Orchestrate，再以可靠操作继续推进同一 Surface。</span>
  </div>
</section>

<script>
(() => {
  const root = document.querySelector('#ws-system-design');
  if (!root) return;
  const svg = root.querySelector('svg');
  const title = root.querySelector('[data-detail-title]');
  const copy = root.querySelector('[data-detail-copy]');
  const buttons = [...root.querySelectorAll('[data-lens]')];
  let activeLens = 'all';

  const details = {
    all: ['整体关系', 'Surface 是持续维护的工作上下文；DSH Session 承载推进；事件把事实交给 Orchestrate，再以可靠操作继续推进同一 Surface。'],
    surface: ['Surface', '物理形态是可寻址 WIP 文件、不可变 Revision 与 Event 流；模型看到的是推进所需的当前投影，且由 1:1 DSH Session Binding 承载。'],
    episode: ['Episode · 尚未定义', '当前代码没有 Episode 实体。必须先决定身份、边界事实、DSH seq 引用、输入输出 Revision/EventRef、存储、折叠恢复与测试，才能成为正式概念。'],
    orchestrate: ['Orchestrate', 'Definition 与 Registration 读取 Surface 事件历史形成 Activation；先持久化 Operation，再执行 emit / followup，并把结果结算回事件流。']
  };

  const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);

  const text = (x, y, label, className = 'ws-label', anchor = 'start') =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${className}">${esc(label)}</text>`;

  const status = (x, y, tone, label) =>
    `<circle cx="${x}" cy="${y - 4}" r="4" class="ws-status-${tone}"/>${text(x + 10, y, label, 'ws-sub')}`;

  const arrowDefs = () => `
    <defs>
      <marker id="ws-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ws-line)"/>
      </marker>
      <marker id="ws-arrow-primary" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ws-primary)"/>
      </marker>
      <marker id="ws-arrow-blue" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ws-blue)"/>
      </marker>
    </defs>`;

  const group = (lens, content) => `<g class="ws-node" data-concept="${lens}">${content}</g>`;

  function desktop(width) {
    const height = 575;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.height = `${height}px`;
    const scale = width / 1100;
    const X = (n) => Math.round(n * scale);
    const surfaceX = X(250);
    const surfaceY = 290;
    const surfaceR = Math.min(168, X(170));
    const execX = X(530);
    const eventX = X(765);
    const orchX = X(945);
    const nodeW = Math.max(154, X(170));

    return `${arrowDefs()}
      <title id="ws-diagram-title">WorkSurface 的事实、执行与编排关系</title>
      <desc id="ws-diagram-desc">Surface 通过 DSH Session 推进并产生事件；Orchestrate 依据统一 Definition 与事件历史形成可靠操作，再回到同一 Surface。</desc>

      <path class="ws-edge ws-edge-primary" marker-end="url(#ws-arrow-primary)" d="M ${surfaceX + surfaceR - 4} 250 C ${X(420)} 220, ${X(430)} 184, ${execX - nodeW / 2 - 12} 184"/>
      ${text(X(421), 205, '模型可见投影', 'ws-sub', 'middle')}
      <path class="ws-edge" marker-end="url(#ws-arrow)" d="M ${execX + nodeW / 2} 222 C ${X(650)} 222, ${X(670)} 258, ${eventX - nodeW / 2} 258"/>
      <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${eventX + nodeW / 2} 258 C ${X(855)} 258, ${X(855)} 258, ${orchX - nodeW / 2} 258"/>
      <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${orchX} 340 C ${orchX} 470, ${X(670)} 530, ${surfaceX + 70} ${surfaceY + surfaceR - 4}"/>
      ${text(X(700), 505, 'Operation → emit / followup', 'ws-sub', 'middle')}

      ${group('surface', `
        <circle cx="${surfaceX}" cy="${surfaceY}" r="${surfaceR}" class="ws-surface-shell"/>
        ${text(surfaceX, surfaceY - 86, 'SURFACE', 'ws-kicker', 'middle')}
        ${text(surfaceX, surfaceY - 52, '工作上下文', 'ws-label', 'middle')}
        ${text(surfaceX, surfaceY - 29, '推进所依赖、模型可见', 'ws-sub', 'middle')}
        <path d="M ${surfaceX - 102} ${surfaceY + 4} H ${surfaceX + 102}" class="ws-edge"/>
        ${text(surfaceX - 96, surfaceY + 31, '可寻址', 'ws-label')}
        ${text(surfaceX - 96, surfaceY + 51, '结构化内容可定位局部', 'ws-sub')}
        ${text(surfaceX - 96, surfaceY + 83, '持续维护', 'ws-label')}
        ${text(surfaceX - 96, surfaceY + 103, '推进中持续写入与修订', 'ws-sub')}
        ${status(surfaceX - 96, surfaceY + 137, 'ok', '已实现：WIP + Revision + Event')}
      `)}

      ${group('surface', `
        <rect x="${execX - nodeW / 2}" y="130" width="${nodeW}" height="190" rx="18" class="ws-shape ws-blue-shape"/>
        ${text(execX, 158, 'DSH SESSION', 'ws-kicker', 'middle')}
        ${text(execX, 184, '当前推进载体', 'ws-label', 'middle')}
        <rect x="${execX - nodeW / 2 + 22}" y="202" width="${nodeW - 44}" height="30" rx="15" class="ws-shape"/>
        ${text(execX, 222, 'Turn', 'ws-sub', 'middle')}
        <rect x="${execX - nodeW / 2 + 34}" y="240" width="${nodeW - 68}" height="50" rx="13" class="ws-shape"/>
        ${text(execX, 261, 'Step', 'ws-label', 'middle')}
        ${text(execX, 279, '模型调用 + 所请求工具', 'ws-sub', 'middle')}
        ${status(execX - nodeW / 2 + 18, 310, 'ok', '1:1 Session Binding')}
      `)}

      ${group('episode', `
        <path d="M ${execX - nodeW / 2} 365 H ${execX + nodeW / 2} V 455 H ${execX - nodeW / 2} Z" class="ws-shape ws-purple-shape"/>
        ${text(execX, 392, 'EPISODE ?', 'ws-kicker', 'middle')}
        ${text(execX, 419, '尚无严格物理定义', 'ws-label', 'middle')}
        ${text(execX, 440, '不能从 Step / Turn 猜测边界', 'ws-sub', 'middle')}
        ${status(execX - nodeW / 2 + 18, 474, 'pending', '待定义，不是当前实体')}
      `)}

      ${group('surface', `
        <rect x="${eventX - nodeW / 2}" y="214" width="${nodeW}" height="112" rx="18" class="ws-shape"/>
        ${text(eventX, 242, 'WORKSURFACE EVENT', 'ws-kicker', 'middle')}
        ${text(eventX, 269, '推进事实', 'ws-label', 'middle')}
        ${text(eventX, 290, 'name · payload · causes · meta', 'ws-sub', 'middle')}
        ${status(eventX - nodeW / 2 + 18, 316, 'partial', '事件已实现；通用内容 ref 待定')}
      `)}

      ${group('orchestrate', `
        <rect x="${orchX - nodeW / 2}" y="202" width="${nodeW}" height="146" rx="24" class="ws-shape ws-blue-shape"/>
        ${text(orchX, 231, 'ORCHESTRATE', 'ws-kicker', 'middle')}
        ${text(orchX, 260, '事件驱动推进', 'ws-label', 'middle')}
        ${text(orchX, 284, 'Definition + Registration', 'ws-sub', 'middle')}
        ${text(orchX, 304, '+ Event history → Activation', 'ws-sub', 'middle')}
        ${status(orchX - nodeW / 2 + 18, 336, 'ok', '先记录 Operation，再执行')}
      `)}

      ${group('orchestrate', `
        <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${X(795)} 75 H ${X(875)}"/>
        <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${X(795)} 135 C ${X(830)} 135, ${X(840)} 75, ${X(875)} 75"/>
        <rect x="${X(650)}" y="50" width="${X(145)}" height="50" rx="14" class="ws-shape"/>
        ${text(X(722.5), 72, 'YAML Pattern', 'ws-label', 'middle')}
        ${text(X(722.5), 89, '常见模式', 'ws-sub', 'middle')}
        <rect x="${X(650)}" y="110" width="${X(145)}" height="50" rx="14" class="ws-shape"/>
        ${text(X(722.5), 132, 'Code Builder', 'ws-label', 'middle')}
        ${text(X(722.5), 149, '复杂作者逻辑', 'ws-sub', 'middle')}
        <rect x="${X(875)}" y="43" width="${X(185)}" height="64" rx="16" class="ws-shape ws-orange-shape"/>
        ${text(X(967.5), 68, 'Canonical Definition', 'ws-label', 'middle')}
        ${text(X(967.5), 88, '统一执行边界 · 目标设计', 'ws-sub', 'middle')}
        ${text(X(835), 59, 'compile / adapt', 'ws-sub', 'middle')}
        ${status(X(887), 128, 'partial', '当前只有 definition.json v1')}
      `)}
    `;
  }

  function mobile(width) {
    const height = 1030;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.height = `${height}px`;
    const cx = width / 2;
    const cardX = 18;
    const cardW = width - 36;
    const edgeX = Math.max(28, cx - cardW * 0.37);
    return `${arrowDefs()}
      <title id="ws-diagram-title">WorkSurface 的事实、执行与编排关系</title>
      <desc id="ws-diagram-desc">Surface 通过 DSH Session 推进并产生事件；Orchestrate 依据统一 Definition 与事件历史形成可靠操作，再回到同一 Surface。</desc>
      <path class="ws-edge ws-edge-primary" marker-end="url(#ws-arrow-primary)" d="M ${edgeX} 215 V 257"/>
      <path class="ws-edge" marker-end="url(#ws-arrow)" d="M ${edgeX} 397 V 439"/>
      <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${edgeX} 534 V 576"/>
      <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${edgeX} 707 V 749"/>
      <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${cx + cardW * 0.34} 835 C ${width - 2} 835, ${width - 2} 150, ${cx + cardW * 0.34} 150"/>

      ${group('surface', `
        <rect x="${cardX}" y="38" width="${cardW}" height="177" rx="26" class="ws-surface-shell"/>
        ${text(cx, 68, 'SURFACE · 工作上下文', 'ws-label', 'middle')}
        ${text(cx, 91, '推进所依赖、模型可见', 'ws-sub', 'middle')}
        ${text(cardX + 22, 124, '可寻址', 'ws-label')}
        ${text(cardX + 22, 144, '结构化内容可定位局部', 'ws-sub')}
        ${text(cardX + 22, 171, '持续维护', 'ws-label')}
        ${text(cardX + 22, 191, 'WIP + Revision + Event', 'ws-sub')}
      `)}

      ${group('surface', `
        <rect x="${cardX}" y="257" width="${cardW}" height="140" rx="20" class="ws-shape ws-blue-shape"/>
        ${text(cx, 286, 'DSH SESSION · 当前推进载体', 'ws-label', 'middle')}
        ${text(cx, 311, 'Session → Turn → Step', 'ws-sub', 'middle')}
        ${text(cx, 334, 'Step = 模型调用 + 所请求工具', 'ws-sub', 'middle')}
        ${status(cardX + 20, 377, 'ok', '1:1 Session Binding')}
      `)}

      ${group('episode', `
        <rect x="${cardX}" y="439" width="${cardW}" height="95" rx="18" class="ws-shape ws-purple-shape"/>
        ${text(cx, 469, 'EPISODE ? · 尚无严格物理定义', 'ws-label', 'middle')}
        ${text(cx, 493, '不能从 Step / Turn 猜测边界', 'ws-sub', 'middle')}
        ${status(cardX + 20, 521, 'pending', '待定义，不是当前实体')}
      `)}

      ${group('surface', `
        <rect x="${cardX}" y="576" width="${cardW}" height="131" rx="20" class="ws-shape"/>
        ${text(cx, 606, 'WORKSURFACE EVENT · 推进事实', 'ws-label', 'middle')}
        ${text(cx, 631, 'name · payload · causes · meta', 'ws-sub', 'middle')}
        ${text(cx, 654, '事件已实现；通用内容 ref 待定', 'ws-sub', 'middle')}
        ${status(cardX + 20, 690, 'partial', '交给 Orchestrate 判断')}
      `)}

      ${group('orchestrate', `
        <rect x="${cardX}" y="749" width="${cardW}" height="120" rx="20" class="ws-shape ws-blue-shape"/>
        ${text(cx, 779, 'ORCHESTRATE · 事件驱动推进', 'ws-label', 'middle')}
        ${text(cx, 805, 'Definition + Registration + Event history', 'ws-sub', 'middle')}
        ${text(cx, 829, '→ Activation → durable Operation', 'ws-sub', 'middle')}
        ${status(cardX + 20, 854, 'ok', 'emit / followup 回到同一 Surface')}
      `)}

      ${group('orchestrate', `
        <rect x="${cardX}" y="911" width="${cardW * 0.46}" height="66" rx="16" class="ws-shape"/>
        ${text(cardX + cardW * 0.23, 938, 'YAML Pattern', 'ws-label', 'middle')}
        ${text(cardX + cardW * 0.23, 958, '常见模式', 'ws-sub', 'middle')}
        <rect x="${cardX + cardW * 0.54}" y="911" width="${cardW * 0.46}" height="66" rx="16" class="ws-shape"/>
        ${text(cardX + cardW * 0.77, 938, 'Code Builder', 'ws-label', 'middle')}
        ${text(cardX + cardW * 0.77, 958, '复杂作者逻辑', 'ws-sub', 'middle')}
        <path class="ws-edge ws-edge-control" marker-end="url(#ws-arrow-blue)" d="M ${cx} 977 V 991"/>
        ${text(cx, 1016, '共同收敛到 Canonical Definition · 目标设计', 'ws-sub', 'middle')}
      `)}
    `;
  }

  function applyLens() {
    svg.querySelectorAll('[data-concept]').forEach((node) => {
      const concept = node.getAttribute('data-concept');
      const visible = activeLens === 'all' || concept === activeLens || (activeLens === 'surface' && concept === 'episode');
      node.classList.toggle('is-dimmed', !visible);
    });
  }

  function draw() {
    const width = Math.max(300, Math.round(root.getBoundingClientRect().width));
    svg.innerHTML = width < 900 ? mobile(width) : desktop(width);
    applyLens();
  }

  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      activeLens = button.dataset.lens;
      buttons.forEach((candidate) => candidate.setAttribute('aria-pressed', String(candidate === button)));
      title.textContent = details[activeLens][0];
      copy.textContent = details[activeLens][1];
      applyLens();
    });
  });

  const resize = new ResizeObserver(draw);
  resize.observe(root);
  draw();
})();
</script>
