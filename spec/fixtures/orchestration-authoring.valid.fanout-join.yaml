version: 1
roles: [coordinator, researcher, verifier]
patterns:
  research-and-verify:
    kind: fanout-join
    history: from-registration
    key: $.payload.taskId
    when:
      from: coordinator
      event: task.ready
    branches:
      research:
        dispatch:
          followup:
            to: researcher
            message: Research ${activation.key}
            operation: start-research
        completes:
          from: researcher
          event: research.completed
      verify:
        dispatch:
          followup:
            to: verifier
            message: Verify ${activation.key}
            operation: start-verification
        completes:
          from: verifier
          event: verification.completed
    then:
      emit:
        - to: coordinator
          event: task.completed
          payload:
            taskId: ${activation.key}
          operation: settle-task
