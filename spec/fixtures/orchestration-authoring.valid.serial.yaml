version: 1
roles: [coordinator, researcher, reviewer]
patterns:
  research-review:
    kind: serial
    history: from-registration
    key: $.payload.taskId
    when:
      from: coordinator
      event: task.ready
    stages:
      - id: research
        dispatch:
          followup:
            to: researcher
            message: Research ${activation.key}
            operation: start-research
        completes:
          from: researcher
          event: research.completed
      - id: review
        dispatch:
          followup:
            to: reviewer
            message: Review ${activation.key}
            operation: start-review
        completes:
          from: reviewer
          event: review.completed
    then:
      emit:
        - to: coordinator
          event: task.completed
          payload:
            taskId: ${activation.key}
          operation: settle-task
